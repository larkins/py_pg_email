# Mail Server Configuration
# This file configures the SMTP server settings
# NOTE: Override these values in your .env file for your specific domain

smtp:
  # Server bind settings
  host: "0.0.0.0"
  port: 2525
  
  # EHLO/HELO hostname - IMPORTANT for reverse DNS
  # This should match your reverse DNS (PTR) record
  # Override via environment variable: DOMAIN
  hostname: "localhost"
  
  # Enable debug logging
  debug: false
  
  # UTF-8 support
  enable_smtputf8: true

# Outbound mail settings (for sending emails via your mail server)
outbound:
  # When sending test emails or system notifications, use this server
  server_host: "127.0.0.1"
  server_port: 2525

  relay_defaults:
    provider: null
    host: "mail-au.smtp2go.com"
    port: 2525
  
  # Default from address for system emails
  # The domain will be automatically set from your DOMAIN env variable
  default_from: "noreply@localhost"
  
  # Reply-to address
  reply_to: "admin@localhost"

# Security settings (can be overridden by environment variables)
security:
  # Rate limiting
  rate_limit:
    enabled: true
    max_connections: 10
    max_emails_per_minute: 30
    max_emails_per_hour: 100
  
  # SPF validation
  spf:
    enabled: true
    reject_on_fail: false  # Changed: Don't reject, just flag SPF failures
  
  # Greylisting
  greylist:
    enabled: true
    delay_minutes: 5
    whitelist_days: 30
  
  # TLS/SSL
  tls:
    enabled: true
    force: false
    cert_path: "certs/server.crt"
    key_path: "certs/server.key"

# DKIM signing for outbound emails
# Improves deliverability to Gmail, Outlook, etc.
dkim:
  enabled: true
  
  # Multi-domain DKIM configuration
  # Add a domain entry for each domain you send from
  domains:
    - domain: "protophysics.com.au"
      selector: "default"
      private_key: "certs/dkim_default.pem"
    - domain: "protophysics.com"
      selector: "protophys"
      private_key: "certs/dkim_protophys.pem"
    - domain: "fencemate.ai"
      selector: "fencemate"
      private_key: "certs/dkim_fencemate.pem"
    - domain: "agieth.ai"
      selector: "default"
      private_key: "certs/dkim_default.pem"
    - domain: "flowerops.io"
      selector: "flowerops"
      private_key: "certs/dkim_flowerops.pem"
    - domain: "enpfitouts.trade"
      selector: "enp1"
      private_key: "certs/dkim_enp1.pem"

  # Fallback single domain config (used if domains list is empty)
  domain: "protophysics.com.au"
  selector: "default"
  private_key: "certs/dkim_default.pem"

# SPF Record - add this to your DNS:
# Type: TXT
# Host: protophysics.com.au
# Value: v=spf1 ip4:203.0.113.10 -all

# API settings
api:
  host: "0.0.0.0"
  port: 5003
  debug: false

# --------------------------------------------------------------------------
# Embedding pipeline (PR1)
# --------------------------------------------------------------------------
# Async embedding + trigram search pipeline. Driven by:
#   * the live insertion-path enqueue helper
#     (app/utils/embedding_enqueue.py) — fires on inbound SMTP, POST /inbound,
#     POST /api/emails, POST /api/emails/<id>/move
#   * the embedding worker (systemd --user service
#     mail-server-embeddings.service, scripts/run_embedding_worker.py)
#
# Defaults: body chunks are embedded only for emails that land in
# Processed or Sent. Subject embedding always runs (kept consistent with
# the new async process per Mal's directive 2026-09-06).
#
# Override any of these via env vars:
#   EMBEDDING_ENABLED, EMBEDDING_GPU_URL, EMBEDDING_GPU_HOST/PORT,
#   EMBEDDING_MODEL, EMBEDDING_DIMENSIONS
embedding:
  enabled: true

  # Local text-embeddings-router (text-embeddings-router --model-id=
  # Qwen/Qwen3-Embedding-4B --port=8080). PID 5086 on aitoptr24.
  gpu_url: "http://127.0.0.1:8080"
  model: "Qwen/Qwen3-Embedding-4B"

  # 1024-dim Matryoshka vectors. halfvec(1024) = 2048 bytes/row, safely
  # under pgvector's HNSW page-entry limit (MEMORY.md 2026-08-16).
  dimensions: 1024

  chunk:
    # Approximate target per chunk in characters. Splits prefer sentence
    # boundaries inside the target window.
    target_chars: 800
    # Overlap (chars) repeated at the start of each subsequent chunk so
    # semantic context isn't lost at the boundary.
    overlap_chars: 100

  # Per-folder opt-in. Any folder NOT listed here has body embedding
  # skipped (subject still gets embedded). Folders are matched
  # case-insensitively against `folders.name`.
  folders:
    Processed:
      enabled: true
    Sent:
      enabled: true
    # Inbox, Drafts, Trash, Archive, Tests, Forwarded — all default off.
    # To enable: add `FolderName: { enabled: true }` below.
