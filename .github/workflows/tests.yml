name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    # GitHub's own secret scanning and push protection are free on a PUBLIC
    # repository. This job is the SYNCHRONOUS gate: it fails the build the
    # moment a secret is committed. GitHub's own scanning is asynchronous --
    # an alert arrives minutes after the push -- so this is the one that
    # actually stops it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not a shallow clone: a secret that was
          # committed and then deleted is still in the history, and
          # deleting the file does not un-leak it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: no secret was committed
        run: python scripts/check_no_secrets.py

  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mail_server_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite requires this; the postgres superuser's password is the
      # CI service's throwaway one.
      POSTGRES_PASSWORD_TEST: password
      MAIL_TEST_PASSWORD: not-a-real-password
      MAIL_TEST_SECURE_PASSWORD: not-a-real-secure-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: the schema
        # db/ holds the base schema and db/migrations/ the increments, in
        # the order the file names give.
        run: |
          set -euo pipefail
          export PGPASSWORD=password
          for f in db/*.sql db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d mail_server_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: the tests
        run: pytest -q
